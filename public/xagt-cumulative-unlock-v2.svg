<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">XAGT cumulative unlock curve</title>
  <desc id="desc">Stacked token unlock schedule from TGE through quarter 12. Initial circulation ranges from 9.5 to 13.5 percent and reaches 100 percent by quarter 12.</desc>
